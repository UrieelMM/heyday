name: invitaciones-digitales

services:
  app:
    image: heyday-app:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Configura NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Configura NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Configura NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Configura NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Configura NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Configura NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Configura SUPABASE_SECRET_KEY}
      QR_MASTER_SECRET: ${QR_MASTER_SECRET:?Configura QR_MASTER_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:?Configura RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?Configura RESEND_FROM_EMAIL}
      PHOTO_RETENTION_TEST_EMAIL: ${PHOTO_RETENTION_TEST_EMAIL:-}
      CRON_SECRET: ${CRON_SECRET:?Configura CRON_SECRET}
    expose:
      - "3000"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - web

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Configura DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Configura ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - web

  cron:
    # Activar sólo después de verificar el remitente y destinatario de avisos.
    profiles:
      - retention
    build:
      context: ./deploy/cron
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET:?Configura CRON_SECRET}
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
